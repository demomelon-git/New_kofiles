name: Build KoFiles APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "KoFiles.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract KoFiles.zip
        run: |
          set -euo pipefail
          test -f KoFiles.zip || { echo "::error::KoFiles.zip is missing from the repository root."; exit 1; }
          mkdir -p "$RUNNER_TEMP/kofiles-source"
          unzip -q KoFiles.zip -d "$RUNNER_TEMP/kofiles-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/kofiles-source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle.kts was not found inside KoFiles.zip."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Auto-fix Kotlin preference setter clashes
        run: |
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          prefs_files = list(root.rglob("Prefs.kt"))
          if not prefs_files:
              raise SystemExit("Prefs.kt was not found; cannot run the compatibility fixer.")

          # Kotlin properties declared with 'var' already generate JVM setX methods.
          # If the source also declares a setX(...) function, rename that explicit
          # function and its Kotlin/Java call sites in the extracted working copy.
          setter_names = [
              "setMode", "setTheme", "setShowHidden", "setFoldersFirst",
              "setConfirmDelete", "setAutoConnect", "setAutoplay", "setSortBy",
              "setSortDesc", "setAdbPort", "setAskOpenWith",
          ]

          sources = list(root.rglob("*.kt")) + list(root.rglob("*.java"))
          changed = 0
          for prefs in prefs_files:
              prefs_text = prefs.read_text(encoding="utf-8")
              for setter in setter_names:
                  if not re.search(r"\bfun\s+" + re.escape(setter) + r"\s*\(", prefs_text):
                      continue
                  replacement = setter.replace("set", "update", 1)
                  if re.search(r"\bfun\s+" + re.escape(replacement) + r"\s*\(", prefs_text):
                      replacement = setter + "Explicitly"
                  pattern = re.compile(r"\b" + re.escape(setter) + r"\b")
                  for source in sources:
                      original = source.read_text(encoding="utf-8")
                      updated = pattern.sub(replacement, original)
                      if updated != original:
                          source.write_text(updated, encoding="utf-8")
                          changed += 1
                  prefs_text = prefs.read_text(encoding="utf-8")

          print(f"Compatibility fixer updated {changed} source file(s).")
          PY

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KoFiles-debug-APK
          path: ${{ runner.temp }}/kofiles-source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KoFiles-build-reports
          path: ${{ runner.temp }}/kofiles-source/**/build/reports/
          if-no-files-found: ignore
          retention-days: 7
